[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridsearch-bench"
version = "0.1.0"
description = "A reproducible benchmark comparing sparse (BM25), dense (FAISS), hybrid retrieval, and neural cross-encoder reranking on SciFact and FiQA."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Zhihao Chen", email = "2212448547@qq.com" },
]
keywords = [
    "information-retrieval",
    "benchmark",
    "bm25",
    "dense-retrieval",
    "hybrid-search",
    "reranking",
    "faiss",
    "scifact",
    "fiqa",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy",
    "faiss-cpu",
    "sentence-transformers",
    "datasets",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["hybridsearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]